<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Square Sierpinski Carpet</title>

    <!-- Vertex Shader -->
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec4 vPosition;

        void main()
        {
            gl_Position = vPosition;
        }
    </script>

    <!-- Fragment Shader -->
    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;

        uniform vec4 uColor;

        void main()
        {
            gl_FragColor = uColor;
        }
    </script>

    <script src="Common/webgl-utils.js"></script>
    <script src="Common/initShaders.js"></script>
    <script src="Common/MV.js"></script>
</head>


<body>

<h2>Square Sierpinski Carpet</h2>

Subdivision :
<input
    id="slider"
    type="range"
    min="0"
    max="6"
    step="1"
    value="0"
>

<br><br>

Square Color :
<input
    id="colorPicker"
    type="color"
    value="#000000"
>

<br><br>

<canvas id="gl-canvas" width="512" height="512">
</canvas>


<script>

var canvas;
var gl;

var points = [];

var numTimesToSubdivide = 0;

var bufferId;
var uColor;


function init()
{
    canvas = document.getElementById("gl-canvas");

    gl = WebGLUtils.setupWebGL(canvas);

    if (!gl) {
        alert("WebGL isn't available");
    }


    // WebGL 설정
    gl.viewport(0, 0, canvas.width, canvas.height);

    // 배경 흰색
    gl.clearColor(1.0, 1.0, 1.0, 1.0);


    // Shader 연결
    var program =
        initShaders(
            gl,
            "vertex-shader",
            "fragment-shader"
        );

    gl.useProgram(program);


    // GPU Buffer
    bufferId = gl.createBuffer();

    gl.bindBuffer(
        gl.ARRAY_BUFFER,
        bufferId
    );


    // shader의 vPosition 연결
    var vPosition =
        gl.getAttribLocation(
            program,
            "vPosition"
        );


    gl.vertexAttribPointer(
        vPosition,
        2,
        gl.FLOAT,
        false,
        0,
        0
    );


    gl.enableVertexAttribArray(
        vPosition
    );


    // 색상 uniform
    uColor =
        gl.getUniformLocation(
            program,
            "uColor"
        );


    // 기본색 검정
    gl.uniform4f(
        uColor,
        0.0,
        0.0,
        0.0,
        1.0
    );


    // 분할 횟수
    document.getElementById("slider").onchange =
        function(event)
        {
            numTimesToSubdivide =
                Number(event.target.value);

            render();
        };


    // 색상 선택
    document.getElementById("colorPicker").oninput =
        function(event)
        {
            var hex = event.target.value;

            var r =
                parseInt(
                    hex.substring(1, 3),
                    16
                ) / 255.0;

            var g =
                parseInt(
                    hex.substring(3, 5),
                    16
                ) / 255.0;

            var b =
                parseInt(
                    hex.substring(5, 7),
                    16
                ) / 255.0;


            gl.uniform4f(
                uColor,
                r,
                g,
                b,
                1.0
            );


            render();
        };


    render();
}



/* 사각형 하나를
   삼각형 2개로 만들기 */
function square(a, b, c, d)
{
    points.push(
        a, b, c,
        a, c, d
    );
}



/* 사각형 분할 */
function divideSquare(
    left,
    bottom,
    right,
    top,
    count
)
{

    // 재귀 종료
    if (count == 0)
    {
        var a = vec2(left, bottom);
        var b = vec2(left, top);
        var c = vec2(right, top);
        var d = vec2(right, bottom);


        square(a, b, c, d);
    }


    else
    {

        var width =
            (right - left) / 3.0;

        var height =
            (top - bottom) / 3.0;


        --count;


        // 3 × 3 반복
        for (var y = 0; y < 3; y++)
        {
            for (var x = 0; x < 3; x++)
            {

                // 가운데는 제외
                if (x == 1 && y == 1)
                {
                    continue;
                }


                divideSquare(
                    left + x * width,
                    bottom + y * height,

                    left + (x + 1) * width,
                    bottom + (y + 1) * height,

                    count
                );
            }
        }
    }
}



window.onload = init;



function render()
{
    points = [];


    // 처음 큰 사각형
    divideSquare(
        -0.9,
        -0.9,
         0.9,
         0.9,
         numTimesToSubdivide
    );


    // GPU로 정점 전송
    gl.bufferData(
        gl.ARRAY_BUFFER,
        flatten(points),
        gl.STATIC_DRAW
    );


    // 화면 지우기
    gl.clear(
        gl.COLOR_BUFFER_BIT
    );


    // 삼각형 그리기
    gl.drawArrays(
        gl.TRIANGLES,
        0,
        points.length
    );
}

</script>

</body>
</html>
